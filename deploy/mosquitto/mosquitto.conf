# Local-only Mosquitto configuration for the edge-cloud demo.
# DO NOT use this in production: anonymous access + plaintext 1883.
#
# Docker: keep 0.0.0.0 here; docker-compose publishes it as 127.0.0.1:1883,
# so it is not reachable from the LAN.
# Native Windows/macOS: change the next line to "listener 1883 127.0.0.1"
# and point persistence_location at a local directory you own.
listener 1883 0.0.0.0

allow_anonymous true

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Keep the demo responsive when a laptop sleeps/resumes.
max_keepalive 120
