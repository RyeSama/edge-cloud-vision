[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-cloud-vision"
version = "0.4.0"
description = "Edge-cloud collaborative vision reference: tiny TFLite gate, MQTT transport, LLM fallback, and temporal memory."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Edge-Cloud Vision Contributors" }]
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "paho-mqtt>=2.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
litert = ["ai-edge-litert>=2.1"]
tensorflow = ["tensorflow>=2.16"]
memory = ["chromadb>=0.5"]
dev = ["pytest>=8.0", "ruff>=0.4", "jsonschema>=4.22"]

[project.scripts]
ecv-edge = "ecvision.edge.__main__:main"
ecv-cloud = "ecvision.cloud.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
